name: Deploy to GitHub Pages

on:
  push:
    branches: ['main'] # or 'master' depending on your default branch
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build MacbookGsapApp
        working-directory: ./MacbookGsapApp
        run: npm run build

      

      - name: Prepare deployment folder
        run: |
          mkdir -p dist/MacbookGsapApp
          cp -r MacbookGsapApp/dist/* dist/MacbookGsapApp/
          

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4