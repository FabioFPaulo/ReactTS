name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            MacbookGsapApp/package-lock.json

      - name: Install dependencies for MacbookGsapApp
        working-directory: ./MacbookGsapApp
        run: npm install

      - name: Build MacbookGsapApp
        working-directory: ./MacbookGsapApp
        run: npm run build

      

      - name: Prepare deployment folder
        run: |
          mkdir -p dist/MacbookGsapApp 
          cp -r MacbookGsapApp/dist/* dist/MacbookGsapApp/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4